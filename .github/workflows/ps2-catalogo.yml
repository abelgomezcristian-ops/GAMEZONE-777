name: Generar catalogo completo PS2

on:
  workflow_dispatch:
  push:
    paths:
      - "data/ps2.js"
      - ".github/workflows/ps2-catalogo.yml"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Generar lista maestra PS2
        run: |
          node <<'NODE'
          const fs = require('fs');

          const SOURCES = [
            'https://en.wikipedia.org/wiki/List_of_PlayStation_2_games_(A%E2%80%93K)',
            'https://en.wikipedia.org/wiki/List_of_PlayStation_2_games_(L%E2%80%93Z)'
          ];

          const TARGET = 4351;
          const EXISTING_FILE = 'data/ps2.js';
          const MASTER_FILE = 'data/ps2-lista-maestra.js';
          const NEW_FILE = 'data/ps2-juegos-nuevos.js';
          const REPORT_FILE = 'data/ps2-lista-reporte.json';

          function decodeHtml(s) {
            return s
              .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>');
          }

          function cleanTitle(cell) {
            let s = cell
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<sup[\s\S]*?<\/sup>/gi, '')
              .replace(/<br\s*\/?>/gi, '\n')
              .replace(/<[^>]+>/g, ' ');

            s = decodeHtml(s)
              .replace(/\[[^\]]*\]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            // En las filas de Wikipedia, los títulos alternativos van
            // normalmente después de "•". Conservamos el título principal.
            s = s.split('•')[0].trim();

            return s;
          }

          function key(s) {
            return s
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/[^a-z0-9]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function extractGames(html, pageName) {
            // Buscamos la sección "Games list" para no tomar "Applications".
            const marker = html.search(/Games list\s*\([A-KL-Z–-]+\)/i);
            if (marker < 0) {
              throw new Error(`No se encontró la sección Games list en ${pageName}`);
            }

            const tail = html.slice(marker);
            const tableStart = tail.search(/<table\b/i);
            if (tableStart < 0) {
              throw new Error(`No se encontró la tabla de juegos en ${pageName}`);
            }

            const tableTail = tail.slice(tableStart);
            const tableEnd = tableTail.search(/<\/table>/i);
            const table = tableEnd >= 0
              ? tableTail.slice(0, tableEnd + 8)
              : tableTail;

            const titles = [];
            const rowRegex = /<tr\b[^>]*>([\s\S]*?)<\/tr>/gi;
            let match;

            while ((match = rowRegex.exec(table))) {
              const row = match[1];
              const firstCell = row.match(/<td\b[^>]*>([\s\S]*?)<\/td>/i);
              if (!firstCell) continue;

              const title = cleanTitle(firstCell[1]);
              if (!title) continue;
              if (/^title$/i.test(title)) continue;

              titles.push(title);
            }

            return titles;
          }

          function extractExistingTitles(src) {
            const titles = [];
            const regex = /"titulo"\s*:\s*"((?:\\.|[^"\\])*)"/g;
            let match;

            while ((match = regex.exec(src))) {
              try {
                titles.push(JSON.parse(`"${match[1]}"`));
              } catch {}
            }

            return titles;
          }

          async function main() {
            const htmlPages = [];

            for (const url of SOURCES) {
              const res = await fetch(url, {
                headers: { 'User-Agent': 'GAMEZONE-777 catalog builder' }
              });
              if (!res.ok) {
                throw new Error(`HTTP ${res.status} al descargar ${url}`);
              }
              htmlPages.push(await res.text());
            }

            let sourceTitles = [];
            for (let i = 0; i < htmlPages.length; i++) {
              sourceTitles.push(...extractGames(
                htmlPages[i],
                i === 0 ? 'A-K' : 'L-Z'
              ));
            }

            // Deduplicación de la fuente.
            const sourceSeen = new Set();
            const uniqueSourceTitles = [];

            for (const title of sourceTitles) {
              const k = key(title);
              if (!k || sourceSeen.has(k)) continue;
              sourceSeen.add(k);
              uniqueSourceTitles.push(title);
            }

            if (!fs.existsSync(EXISTING_FILE)) {
              throw new Error(`No existe ${EXISTING_FILE}`);
            }

            const existing = extractExistingTitles(
              fs.readFileSync(EXISTING_FILE, 'utf8')
            );

            const existingSeen = new Set(existing.map(key));
            const existingUnique = [];
            for (const title of existing) {
              const k = key(title);
              if (!k) continue;
              if (!existingUnique.some(x => key(x) === k)) {
                existingUnique.push(title);
              }
            }

            const newTitles = uniqueSourceTitles
              .filter(title => !existingSeen.has(key(title)));

            // El objetivo es 4351 títulos totales si la fuente actual
            // ofrece esa cantidad después de la depuración.
            const capacity = Math.max(0, TARGET - existingUnique.length);
            const selectedNew = newTitles.slice(0, capacity);

            const allTitles = [
              ...existingUnique,
              ...selectedNew
            ];

            const master = `// GAMEZONE 777 — LISTA MAESTRA DE PS2
          // Fuente: Wikipedia, listas "List of PlayStation 2 games (A-K)" y "(L-Z)".
          // Licencia de contenido de Wikipedia: CC BY-SA 4.0.
          // Esta lista contiene títulos, no archivos de juegos.
          const PS2_MASTER_TITLES = ${JSON.stringify(allTitles, null, 2)};
          `;

            const onlyNew = `// GAMEZONE 777 — JUEGOS PS2 NUEVOS
          // Generado desde las listas públicas de Wikipedia.
          const PS2_NEW_TITLES = ${JSON.stringify(selectedNew, null, 2)};
          `;

            const report = {
              target: TARGET,
              existing_in_file: existingUnique.length,
              source_rows_before_dedupe: sourceTitles.length,
              source_titles_after_dedupe: uniqueSourceTitles.length,
              new_candidates_after_existing_filter: newTitles.length,
              new_titles_selected: selectedNew.length,
              final_total: allTitles.length,
              source_urls: SOURCES,
              generated_at: new Date().toISOString()
            };

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync(MASTER_FILE, master);
            fs.writeFileSync(NEW_FILE, onlyNew);
            fs.writeFileSync(REPORT_FILE, JSON.stringify(report, null, 2));

            console.log(JSON.stringify(report, null, 2));
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ps2-lista-maestra.js data/ps2-juegos-nuevos.js data/ps2-lista-reporte.json
          git diff --cached --quiet || git commit -m "data: generar lista maestra PS2"
          git push
