<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo PS2 - GAMEZONE 777</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070d26;color:#fff}header{padding:20px;text-align:center;border-bottom:2px solid #1a2a5a}header a{color:#2a7fff;text-decoration:none}#q{width:100%;padding:14px 20px;border-radius:30px;border:2px solid #1a2a5a;background:#0f1938;color:#fff;margin:10px 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 14px;border-radius:20px;border:1px solid #1a2a5a;background:#0f1938;color:#8fa0c8;cursor:pointer}.chip.activo{background:#2a7fff;color:#fff}.chip[disabled]{opacity:.4}#catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:20px;max-width:1200px;margin:auto}.card{background:#121a36;border-radius:16px;overflow:hidden;border:1px solid #1a2a5a}.card-body{padding:12px}.precio{color:#00e5ff;font-weight:bold}#btnCargarMas{margin:20px auto;display:block;padding:12px 30px;border-radius:30px;border:1px solid #2a7fff;background:#0f1938;color:#fff;cursor:pointer}</style></head><body>
<header><h1><a href="index.html">GAMEZONE 777</a> / PS2 - 32 JUEGOS</h1></header>
<div style="max-width:900px;margin:auto;padding:20px"><input id="q" placeholder="Buscar en los 32 juegos..."><div class="chips" id="chipsGenero"></div><div id="conteo" style="margin-top:10px;color:#7a8ab8"></div></div>
<div id="catalogo"></div><button id="btnCargarMas" onclick="cargarMas()">Cargar más (24)</button>
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script src="data/ps2/mundo-abierto.js"></script><script src="data/ps2/hack-and-slash.js"></script><script src="data/ps2/aventura.js"></script><script src="data/ps2/terror.js"></script><script src="data/ps2/deportes.js"></script><script src="data/ps2/carreras.js"></script><script src="data/ps2/pelea.js"></script><script src="data/ps2/sigilo.js"></script><script src="data/ps2/rpg.js"></script><script src="data/ps2/shooter-musical.js"></script>
<script>
const generos=[...new Set(GZ_JUEGOS.map(j=>j.genero))]; const contChips=document.getElementById('chipsGenero'); contChips.innerHTML='<button class="chip activo" data-g="todos">TODOS</button>'+generos.map(g=>`<button class="chip" data-g="${g.toLowerCase()}">${g}</button>`).join('')+'<button class="chip" disabled>PS4 PRÓXIMAMENTE</button><button class="chip" disabled>PS5 PRÓXIMAMENTE</button>';
contChips.querySelectorAll('.chip[data-g]').forEach(ch=>ch.addEventListener('click',()=>{contChips.querySelectorAll('.chip').forEach(x=>x.classList.remove('activo'));ch.classList.add('activo');filtro.genero=ch.dataset.g;mostrando=GZ_CONFIG.cargaInicial;renderCatalogo();}));
document.getElementById('q').addEventListener('input',e=>{filtro.texto=e.target.value.toLowerCase();mostrando=GZ_CONFIG.cargaInicial;renderCatalogo();});
filtro.consola='ps2'; renderCatalogo();
</script></body></html>
