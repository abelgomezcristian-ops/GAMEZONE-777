<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAME ZONE 777</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070d26;color:#fff}header{padding:20px;text-align:center;border-bottom:2px solid #1a2a5a}header h1{color:#2a7fff;letter-spacing:2px}.buscador-section{padding:30px 20px;max-width:800px;margin:auto;text-align:center}.buscador-section h2{font-size:32px;margin-bottom:20px;letter-spacing:2px}#buscador{width:100%;padding:16px 24px;border-radius:30px;border:2px solid #1a2a5a;background:#0f1938;color:#fff;font-size:16px;outline:none}.titulo-ps2{padding:20px;max-width:1200px;margin:auto}.titulo-ps2 h2{font-size:28px;letter-spacing:2px}#catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:0 20px 100px;max-width:1200px;margin:auto}.card{background:#121a36;border-radius:16px;overflow:hidden;border:1px solid #1a2a5a}.card img{width:100%;height:190px;object-fit:cover;background:#000}.card-body{padding:12px}.card h3{font-size:13px;min-height:32px}.card p{font-size:11px;color:#7a8ab8;margin:4px 0}.precio{color:#00e5ff;font-weight:bold;margin:8px 0}.btn-add{background:#00e5ff;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%}.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:14px 22px;border-radius:50px;text-decoration:none;font-weight:bold;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5)}</style></head><body><header><h1>GAME ZONE 777</h1></header><div class="buscador-section"><h2>BUSCADOR</h2><input id="buscador" type="text" placeholder="Buscar juego... ej: GTA, Mario, God of War"></div><div class="titulo-ps2"><h2>CATÁLOGO PS2</h2></div><div id="catalogo"></div><a class="wa-float" href="https://wa.me/5493795118415?text=Hola%20GameZone%20777%21%20Quiero%20consultar%20por%20un%20juego" target="_blank">🟢 WhatsApp</a><script>const PS2_GAMES=[{id:1,titulo:"GTA San Andreas",consola:"ps2",genero:"Mundo abierto",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2lbw.jpg"},{id:2,titulo:"God of War II",consola:"ps2",genero:"Hack & Slash",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1u6o.jpg"},{id:3,titulo:"God of War",consola:"ps2",genero:"Hack & Slash",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1u6o.jpg"},{id:4,titulo:"Resident Evil 4",consola:"ps2",genero:"Terror",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1v9v.jpg"},{id:5,titulo:"GTA Vice City",consola:"ps2",genero:"Mundo abierto",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2lbw.jpg"},{id:6,titulo:"Bully",consola:"ps2",genero:"Mundo abierto",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg"},{id:7,titulo:"Shadow of the Colossus",consola:"ps2",genero:"Aventura",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg"},{id:8,titulo:"Devil May Cry 3",consola:"ps2",genero:"Hack & Slash",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1u6o.jpg"},{id:9,titulo:"Silent Hill 2",consola:"ps2",genero:"Terror",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg"},{id:10,titulo:"PES 2013",consola:"ps2",genero:"Deportes",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2wzn.jpg"},{id:11,titulo:"Gran Turismo 4",consola:"ps2",genero:"Carreras",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2wzn.jpg"},{id:12,titulo:"Need for Speed Most Wanted",consola:"ps2",genero:"Carreras",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2wzn.jpg"},{id:13,titulo:"DBZ Budokai Tenkaichi 3",consola:"ps2",genero:"Pelea",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1u6o.jpg"},{id:14,titulo:"Tekken 5",consola:"ps2",genero:"Pelea",precio:2000,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1u6o.jpg"},{id:15,titulo:"Metal Gear Solid 3",consola:"ps2",genero:"Sigilo",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg"},{id:16,titulo:"Final Fantasy X",consola:"ps2",genero:"RPG",precio:2500,img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg"}];const catalogo=document.getElementById('catalogo');const buscador=document.getElementById('buscador');function render(filtro=''){const q=filtro.toLowerCase();const filtrados=PS2_GAMES.filter(j=>j.titulo.toLowerCase().includes(q)||j.genero.toLowerCase().includes(q));catalogo.innerHTML=filtrados.map(j=>`<div class="card"><img src="${j.img}" alt="${j.titulo}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(j.titulo)}'"><div class="card-body"><h3>${j.titulo}</h3><p>${j.consola.toUpperCase()} • ${j.genero}</p><div class="precio">$${j.precio.toLocaleString()}</div><button class="btn-add" onclick="agregar(${j.id})">AGREGAR</button></div></div>`).join('');if(filtrados.length===0)catalogo.innerHTML=`<p style="grid-column:1/-1;text-align:center;">No se encontró "${filtro}"</p>`}function agregar(id){const juego=PS2_GAMES.find(j=>j.id===id);let cart=JSON.parse(localStorage.getItem('gz_cart')||'[]');cart.push(juego);localStorage.setItem('gz_cart',JSON.stringify(cart));alert(juego.titulo+' agregado')}buscador.addEventListener('input',e=>render(e.target.value));render('');</script></body></html>
