const catalogo=document.getElementById('catalogo'); const q=document.getElementById('q'); const tituloCat=document.getElementById('tituloCat'); const conteo=document.getElementById('conteo');
function render(){let f=JUEGOS.filter(j=>{const okConsola=consolaActiva==='todos'||j.consola===consolaActiva; const okTexto=j.titulo.toLowerCase().includes(textoActivo)||j.genero.toLowerCase().includes(textoActivo); return okConsola&&okTexto}); tituloCat.textContent=consolaActiva==='todos'?'CATÁLOGO COMPLETO':'CATÁLOGO '+consolaActiva.toUpperCase(); conteo.textContent=f.length+' juegos'; catalogo.innerHTML=f.map(j=>`<div class="card"><img src="${j.img}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(j.titulo)}'"><div class="card-body"><h3>${j.titulo}</h3><p>${j.consola.toUpperCase()} • ${j.genero}</p><div class="precio">$${j.precio.toLocaleString()}</div><div class="btns"><button class="btn btn-add" onclick="add(${j.id})">AGREGAR</button><a class="btn btn-wa" href="https://wa.me/5493795118415?text=Hola%20GameZone%20777%20quiero%20${encodeURIComponent(j.titulo)}" target="_blank">WA</a></div></div></div>`).join(''); if(f.length===0) catalogo.innerHTML=`<p style="grid-column:1/-1;text-align:center;color:#7a8ab8">No se encontró "${textoActivo}" en ${consolaActiva.toUpperCase()}</p>`}
function add(id){let j=JUEGOS.find(x=>x.id===id); let c=JSON.parse(localStorage.getItem('gz_cart')||'[]'); c.push(j); localStorage.setItem('gz_cart',JSON.stringify(c)); alert(j.titulo+' agregado')}

q.addEventListener('input',e=>{textoActivo=e.target.value.toLowerCase().trim(); render()}); render();
</script></body></html>
